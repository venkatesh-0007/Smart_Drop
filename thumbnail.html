<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    img.contain {
      object-fit: contain;
    }
    .loader {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8e8e93;
      font-size: 11px;
      text-align: center;
      padding: 8px;
    }
    .fallback-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const fileId = parseInt(params.get('id'), 10);
    const fit = params.get('fit') || 'cover';
    
    function showFallback(msg = "Failed to load") {
      const loader = document.getElementById('loader');
      if (loader) loader.remove();
      document.body.innerHTML = `
        <div class="fallback">
          <div class="fallback-icon">⚠️</div>
          <div>${msg}</div>
        </div>
      `;
    }

    if (fileId) {
      console.log(`[DEBUG FRAME] Fetching image content for file ID: ${fileId}`);
      try {
        chrome.runtime.sendMessage({ action: "GET_FILE_CONTENT", id: fileId }, response => {
          const loader = document.getElementById('loader');
          if (loader) loader.remove();

          if (response && response.success && response.arrayBuffer) {
            try {
              const blob = new Blob([response.arrayBuffer], { type: response.type });
              const url = URL.createObjectURL(blob);
              console.log(`[DEBUG FRAME] Created temporary frame image URL: ${url}`);
              
              const img = document.createElement('img');
              img.src = url;
              if (fit === 'contain') {
                img.className = 'contain';
              }
              img.onload = () => {
                console.log(`[DEBUG FRAME] Image loaded successfully. Revoking: ${url}`);
                URL.revokeObjectURL(url);
              };
              img.onerror = () => {
                console.warn(`[DEBUG FRAME] Image load failed. Revoking: ${url}`);
                URL.revokeObjectURL(url);
                showFallback("Corrupt Image");
              };
              document.body.appendChild(img);
            } catch (e) {
              console.error("[DEBUG FRAME] Error creating blob or image element:", e);
              showFallback("Render Error");
            }
          } else {
            console.warn(`[DEBUG FRAME] Failed to get content for file ID: ${fileId}. Error:`, response?.error);
            showFallback("Not Found");
          }
        });
      } catch (err) {
        console.error("[DEBUG FRAME] Sync error invoking sendMessage:", err);
        showFallback("Connection Error");
      }
    } else {
      showFallback("Invalid ID");
    }
  </script>
</body>
</html>
