<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    img {
      width: 100%;
      height: 100%;
      display: block;
      /* default fit parameter */
      object-fit: cover;
    }
    img.contain {
      object-fit: contain;
    }
    /* Simple spinner for image loading */
    .loader {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const fileId = parseInt(params.get('id'), 10);
    const fit = params.get('fit') || 'cover';
    
    if (fileId) {
      chrome.runtime.sendMessage({ action: "GET_FILE_CONTENT", id: fileId }, response => {
        const loader = document.getElementById('loader');
        if (loader) loader.remove();

        if (response && response.success && response.arrayBuffer) {
          const blob = new Blob([response.arrayBuffer], { type: response.type });
          const url = URL.createObjectURL(blob);
          
          const img = document.createElement('img');
          img.src = url;
          if (fit === 'contain') {
            img.className = 'contain';
          }
          document.body.appendChild(img);
        } else {
          // Render error layout if failed
          document.body.innerHTML = '<span style="color:#ff453a;font-size:10px;">⚠️</span>';
        }
      });
    } else {
      const loader = document.getElementById('loader');
      if (loader) loader.remove();
    }
  </script>
</body>
</html>
